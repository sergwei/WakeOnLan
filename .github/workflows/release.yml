name: Release

# Al publicar un tag v1.2.3 se pasan los tests, se compila, se firma (si SignPath está configurado)
# y se crea una Release con el portable, el instalador, los hashes y las attestations.
# (Para probar la compilación sin publicar está ci.yml, que se ejecuta en cada push.)
on:
  push:
    tags: ["v*"]

# Por defecto, solo lectura; el job pide lo mínimo que necesita.
permissions:
  contents: read

env:
  # Instalador oficial de Inno Setup, verificado por hash antes de ejecutarlo.
  INNO_URL: https://github.com/jrsoftware/issrc/releases/download/is-6_7_3/innosetup-6.7.3.exe
  INNO_SHA256: 9C73C3BAE7ED48D44112A0F48E66742C00090BDB5BEF71D9D3C056C66E97B732

jobs:
  # Los tests ejecutan código de terceros (paquetes NuGet de xUnit). Van en un job aparte, sin permisos
  # ni secretos, para que ese código nunca toque los binarios que se firman y se publican.
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "8.0.x"

      - name: Tests
        run: dotnet test WakeOnLan.sln -c Release

  # Compila solo la app (sin dependencias NuGet de terceros), la firma y publica la Release.
  release:
    needs: test
    runs-on: windows-latest
    # Environment protegido: solo tags v*, requiere aprobación manual y guarda los secretos de firma.
    environment: release
    permissions:
      contents: write      # crear la Release
      actions: read        # SignPath lee los artefactos del job
      id-token: write      # firmar las attestations (Sigstore)
      attestations: write  # guardar las attestations
    env:
      # La firma se activa sola cuando existe la variable del repositorio SIGNPATH_ORGANIZATION_ID.
      SIGN: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' && github.ref_type == 'tag' }}
    steps:
      # Acciones fijadas por SHA de commit: un tag puede moverse, un SHA no. Dependabot las actualiza.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "8.0.x"

      - name: Calcular versión
        id: version
        shell: pwsh
        env:
          # El nombre del tag se lee desde una variable de entorno, nunca interpolado en el script.
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          $v = if ($env:REF_TYPE -eq 'tag') { $env:REF_NAME -replace '^v', '' } else { '0.0.0-dev' }
          if ($v -notmatch '^\d+\.\d+\.\d+(-[0-9A-Za-z.-]+)?$') { throw "Versión no válida: '$v'" }
          "value=$v" >> $env:GITHUB_OUTPUT

      - name: Instalar Inno Setup
        shell: pwsh
        run: |
          $installer = Join-Path $env:RUNNER_TEMP 'innosetup.exe'
          Invoke-WebRequest $env:INNO_URL -OutFile $installer
          $hash = (Get-FileHash $installer -Algorithm SHA256).Hash
          if ($hash -ne $env:INNO_SHA256) { throw "Hash de Inno Setup inesperado: $hash" }
          Start-Process $installer -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/SP-' -Wait

      - name: Compilar
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: ./tools/Publish.ps1 -Version $env:VERSION -Stage Build

      # ----- Firma de los ejecutables (antes de empaquetarlos en el instalador) -----
      - name: Subir ejecutables sin firmar
        id: unsigned-app
        if: env.SIGN == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unsigned-app
          path: |
            artifacts/publish/WakeOnLan.exe
            artifacts/publish/WakeOnLan.dll
            artifacts/publish-portable/WakeOnLan.exe
          # Solo hace falta mientras SignPath los descarga: no dejar binarios sin firmar a la vista.
          retention-days: 1

      - name: Firmar ejecutables
        if: env.SIGN == 'true'
        uses: signpath/github-action-submit-signing-request@c92b958760219087e01f8d67a1669ed57afe2627 # v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_POLICY_SLUG }}
          artifact-configuration-slug: app
          github-artifact-id: ${{ steps.unsigned-app.outputs.artifact-id }}
          parameters: |
            version: "${{ steps.version.outputs.value }}"
          # SignPath Foundation exige aprobación manual: tiempo de sobra para aprobarla.
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: artifacts

      - name: Empaquetar
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: ./tools/Publish.ps1 -Version $env:VERSION -Stage Package

      # ----- Firma del instalador -----
      - name: Subir instalador sin firmar
        id: unsigned-installer
        if: env.SIGN == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unsigned-installer
          path: artifacts/WakeOnLan-${{ steps.version.outputs.value }}-setup.exe
          retention-days: 1

      - name: Firmar instalador
        if: env.SIGN == 'true'
        uses: signpath/github-action-submit-signing-request@c92b958760219087e01f8d67a1669ed57afe2627 # v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_POLICY_SLUG }}
          artifact-configuration-slug: installer
          github-artifact-id: ${{ steps.unsigned-installer.outputs.artifact-id }}
          parameters: |
            version: "${{ steps.version.outputs.value }}"
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: artifacts

      - name: Verificar firmas
        if: env.SIGN == 'true'
        shell: pwsh
        run: |
          Get-ChildItem artifacts -Filter *.exe | ForEach-Object {
            $s = Get-AuthenticodeSignature $_.FullName
            if ($s.Status -ne 'Valid') { throw "$($_.Name): firma $($s.Status)" }
            "$($_.Name): $($s.SignerCertificate.Subject)"
          }

      - name: Hashes
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: ./tools/Publish.ps1 -Version $env:VERSION -Stage Checksums

      - name: Attestation de procedencia
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: artifacts/*.exe

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: WakeOnLan-${{ steps.version.outputs.value }}
          path: |
            artifacts/*.exe
            artifacts/SHA256SUMS.txt
          # La copia que vale es la de la Release.
          retention-days: 7

      - name: Crear Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: |
            artifacts/*.exe
            artifacts/SHA256SUMS.txt
          generate_release_notes: true
          fail_on_unmatched_files: true
