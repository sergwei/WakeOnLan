version: 2
updates:
  # Mantiene al día las acciones fijadas por SHA en los workflows.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  # Paquetes NuGet (solo los usa el proyecto de tests). Revisar cada PR antes de aceptarlo.
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
